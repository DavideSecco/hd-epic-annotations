<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>SLAM viewer — smoke test</title>
<link rel="stylesheet" href="slam-viewer.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0f0f1e; color: #e0e0f0; font-family: monospace; }
  header { padding: 10px 16px; background: #161634; border-bottom: 1px solid #2a2a55; }
  header h1 { font-size: 14px; color: #7eb8f7; font-weight: normal; }
  header .meta { font-size: 12px; color: #99a; margin-top: 2px; }

  #slam-host { width: 100%; height: 70vh; position: relative; background: #000; }

  #ctrl { padding: 12px 16px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  #ctrl input[type=range] { flex: 1; min-width: 280px; accent-color: #7eb8f7; }
  #ctrl button {
    background: #1e3f66; color: #7eb8f7; border: 1px solid #5a9fd4;
    border-radius: 6px; padding: 6px 14px; cursor: pointer; font-family: monospace; font-size: 13px;
  }
  #ctrl button:hover { background: #2a5580; }
  #ctrl .layers { display: flex; flex-wrap: wrap; gap: 8px 14px; padding: 8px 16px; border-top: 1px solid #2a2a55; width: 100%; }
  #ctrl label { display: flex; align-items: center; gap: 4px; font-size: 12px; color: #aac; }
  #ctrl label input { accent-color: #7eb8f7; }
  #lbl { color: #99a; font-size: 12px; min-width: 140px; }
</style>
<script type="importmap">
{
  "imports": {
    "three":          "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
    "three/addons/":  "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
  }
}
</script>
</head>
<body>

<header>
  <h1>slam-viewer.js — smoke test</h1>
  <div class="meta">Mounts the shared module in isolation. Data: P01 session 0.</div>
</header>

<div id="slam-host"></div>

<div id="ctrl">
  <button id="play">▶</button>
  <input type="range" id="t" min="0" max="10000" value="0" step="1">
  <span id="lbl">0:00 / 0:00</span>
  <button id="fit">⟳ Fit</button>
  <button id="reinit">destroy &amp; reinit</button>

  <div class="layers">
    <label><input type="checkbox" id="L-kitchen"    checked> kitchen</label>
    <label><input type="checkbox" id="L-trajectory" checked> trajectory</label>
    <label><input type="checkbox" id="L-head"       checked> head</label>
    <label><input type="checkbox" id="L-gaze"       checked> gaze</label>
    <label><input type="checkbox" id="L-objects"    checked> objects</label>
    <label><input type="checkbox" id="L-movements"  checked> movements</label>
    <label><input type="checkbox" id="L-grid"       checked> grid</label>
    <label><input type="checkbox" id="L-persist">      all-movements-at-once</label>
  </div>
</div>

<script type="module">
import { initSlamViewer } from './slam-viewer.js';

const DATA_URL = '../output/slam_P01-20240202-110250.json';
const GLB_URL  = '../output/P01_final.glb';

const host    = document.getElementById('slam-host');
const playBtn = document.getElementById('play');
const slider  = document.getElementById('t');
const lbl     = document.getElementById('lbl');

let slam = null;
let duration = 0;
let playing = false;
let currentS = 0;
let lastMs   = null;

function fmt(s) {
  const m = Math.floor(s / 60), ss = Math.floor(s % 60);
  return `${m}:${ss.toString().padStart(2, '0')}`;
}

function applyTime(s) {
  currentS = Math.max(0, Math.min(duration, s));
  slam.setTime(currentS);
  slider.value = Math.round(duration > 0 ? (currentS / duration) * 10000 : 0);
  lbl.textContent = `${fmt(currentS)} / ${fmt(duration)}`;
}

async function mount() {
  slam = await initSlamViewer({
    container: host,
    dataUrl:   DATA_URL,
    glbUrl:    GLB_URL,
  });
  duration = slam.getInfo().duration_s;
  applyTime(0);
  // Re-sync the UI checkboxes with the freshly mounted scene.
  for (const cb of document.querySelectorAll('#ctrl input[type=checkbox]')) {
    cb.dispatchEvent(new Event('change'));
  }
}

await mount();

playBtn.addEventListener('click', () => {
  playing = !playing;
  playBtn.textContent = playing ? '⏸' : '▶';
  if (playing) lastMs = null;
});

slider.addEventListener('input', () => {
  applyTime((slider.value / 10000) * duration);
});

document.getElementById('fit').addEventListener('click', () => slam.fitCamera());

document.getElementById('reinit').addEventListener('click', async () => {
  playing = false;
  playBtn.textContent = '▶';
  slam.destroy();
  slam = null;
  await mount();
});

const wireLayer = (id, layer) => {
  document.getElementById(id).addEventListener('change',
    (e) => slam && slam.setLayerVisible(layer, e.target.checked));
};
wireLayer('L-kitchen',    'kitchen');
wireLayer('L-trajectory', 'trajectory');
wireLayer('L-head',       'head');
wireLayer('L-gaze',       'gaze');
wireLayer('L-objects',    'objects');
wireLayer('L-movements',  'movements');
wireLayer('L-grid',       'grid');
document.getElementById('L-persist').addEventListener('change',
  (e) => slam && slam.setMovementsPersistent(e.target.checked));

document.addEventListener('keydown', (e) => {
  if (e.code === 'Space' && e.target === document.body) {
    e.preventDefault();
    playBtn.click();
  }
});

function tick(nowMs) {
  requestAnimationFrame(tick);
  if (!playing || !slam) { lastMs = null; return; }
  if (lastMs !== null) {
    const dt = (nowMs - lastMs) / 1000;
    let next = currentS + dt;
    if (next > duration) next = 0;
    applyTime(next);
  }
  lastMs = nowMs;
}
requestAnimationFrame(tick);
</script>
</body>
</html>
